name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master branch
        run: |
          git fetch origin master
          COMMIT_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "::error::Tag ${{ github.ref_name }} (commit $COMMIT_SHA) is not on the master branch. Releases are only published for tags on the master branch."
            exit 1
          fi
          echo "Confirmed: Tag ${{ github.ref_name }} ($COMMIT_SHA) is on master branch."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: |
          go vet ./...
          go test ./...

      - name: Build and package release assets
        run: |
          make VERSION=${{ github.ref_name }} package
          make checksums

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_FLAGS=()
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; uploading assets with --clobber..."
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            echo "Creating new release ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" \
              dist/* \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
